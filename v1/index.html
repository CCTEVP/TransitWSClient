<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transit WebSocket Client</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Transit WebSocket Client</h1>

      <section class="controls">
        <label for="wsUrl">WebSocket URL</label>
        <input id="wsUrl" type="text" value="ws://localhost:8282/content" />
        <div class="buttons presets">
          <button type="button" data-server="local">Local server</button>
          <button type="button" data-server="remote">Cloud Run</button>
        </div>

        <div class="buttons">
          <button id="connectBtn" type="button">Connect</button>
          <button id="disconnectBtn" type="button" disabled>Disconnect</button>
          <button id="clearBtn" type="button">Clear</button>
        </div>

        <p>
          Status:
          <span id="status" class="status disconnected">Disconnected</span>
        </p>
      </section>

      <section>
        <h2>Received Messages</h2>
        <div id="messages" class="messages" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
